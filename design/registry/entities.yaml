# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effective_damage
    status: active
    source: design/gdd/damage-health.md
    referenced_by:
      - design/gdd/damage-health.md
    variables:
      - raw_damage
      - damage_reduction
    expression: "max(1, floor(raw_damage × (1 - damage_reduction)))"
    output_range: [1, 40]
    notes: "Player incoming damage formula. raw_damage comes from AttackEvent.AttackDamage forwarded by Parry System. damage_reduction is upgrade-gated (0.0 at run start, capped at 0.75). Minimum 1 enforced post-floor."
    added: 2026-05-16
    revised: ""

  - name: xp_drop
    status: active
    source: design/gdd/enemy-definition.md
    referenced_by:
      - design/gdd/enemy-definition.md
    variables:
      - xp_weight
      - xp_scalar
    expression: "xp_weight[enemy_type] × xp_scalar"
    output_range: [0, unbounded]
    notes: "xp_scalar is owned by Progression System GDD. xp_weight per enemy type is defined in enemy-definition.md."
    added: 2026-05-11
    revised: ""

  - name: elite_stagger_resistance
    status: active
    source: design/gdd/enemy-definition.md
    referenced_by:
      - design/gdd/enemy-definition.md
    variables:
      - finisher_damage
      - combo_counter
      - stagger_resist_multiplier
    expression: "finisher_damage × stagger_resist_multiplier if combo_counter < 2, else finisher_damage"
    output_range: [finisher_damage × stagger_resist_multiplier, finisher_damage]
    notes: "Applies only to Iron Captain and Warlord. Basic infantry are staggered by any Finisher."
    added: 2026-05-11
    revised: ""

  - name: phase_2_trigger_hp
    status: active
    source: design/gdd/enemy-definition.md
    referenced_by:
      - design/gdd/enemy-definition.md
    variables:
      - warlord_max_hp
      - phase_2_threshold_ratio
    expression: "warlord_max_hp × phase_2_threshold_ratio"
    output_range: [0, warlord_max_hp]
    notes: "Default: 800 × 0.5 = 400 HP. Roar fires before death check if threshold crossed in one hit."
    added: 2026-05-11
    revised: ""

