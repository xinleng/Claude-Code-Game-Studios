# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: base_attack
    status: active
    source: design/gdd/general-characters.md
    referenced_by:
      - design/gdd/general-characters.md
    value: 10
    unit: damage
    notes: "Shared default for all generals. Source of truth here; consumed by Combat Core (auto-attack) and Combo System (Finisher damage formula)."
    added: 2026-05-11
    revised: ""

  - name: base_radius
    status: active
    source: design/gdd/general-characters.md
    referenced_by:
      - design/gdd/general-characters.md
    value: 1.5
    unit: units
    notes: "Shared default melee radius for all generals. Source of truth here; consumed by Combo System (Finisher AoE formula)."
    added: 2026-05-11
    revised: ""

  - name: zhao_yun_cone_half_angle_deg
    status: active
    source: design/gdd/general-characters.md
    referenced_by:
      - design/gdd/general-characters.md
    value: 45
    unit: degrees
    notes: "Half-angle of Zhao Yun's Finisher cone. Total arc = 90 degrees. Safe range 20-70 degrees."
    added: 2026-05-11
    revised: ""

  - name: zhao_yun_input_direction_window_ms
    status: active
    source: design/gdd/general-characters.md
    referenced_by:
      - design/gdd/general-characters.md
    value: 300
    unit: milliseconds
    notes: "How recent a directional input must be to count for Zhao Yun's cone orientation. If no input within this window, falls back to nearest-enemy direction."
    added: 2026-05-11
    revised: ""

  - name: base_max_hp
    status: active
    source: design/gdd/damage-health.md
    referenced_by:
      - design/gdd/damage-health.md
    value: 100
    unit: HP
    notes: "Player starting max HP per run. Survivability upgrades add flat bonus via max_hp_bonus. Source of truth here; Run Session Manager reads at retry; Upgrade Definition GDD reads when applying HP upgrades."
    added: 2026-05-16
    revised: ""

  - name: invulnerability_duration_ms
    status: active
    source: design/gdd/damage-health.md
    referenced_by:
      - design/gdd/damage-health.md
    value: 500
    unit: milliseconds
    notes: "Post-damage iframe window. During this window incoming damage is discarded; parry input still processed. Timer does not reset on discarded hits. Implementation uses Time.unscaledTime (pause-immune). Regen uses Time.deltaTime (pause-respecting) — asymmetry documented as intentional in damage-health.md Formula 2."
    added: 2026-05-16
    revised: "2026-05-18"

  - name: reset_damage_threshold
    status: active
    source: design/gdd/damage-health.md
    referenced_by:
      - design/gdd/damage-health.md
      - design/gdd/upgrade-definition.md
    value: 3
    unit: HP
    notes: "Minimum effective_damage required to trigger combo_counter and momentum_meter resets on DamageTaken. Hits below threshold deal HP damage but do not reset combat state. Prevents trivial grazes (1-damage at max defense) from carrying same cost as real hits."
    added: 2026-05-18
    revised: ""

  - name: regen_rate_max
    status: active
    source: design/gdd/damage-health.md
    referenced_by:
      - design/gdd/damage-health.md
      - design/gdd/upgrade-definition.md
    value: 1.5
    unit: HP/s
    notes: "Hard ceiling for combined regen_rate from all upgrade sources. Below immortality threshold (2.0 HP/s at default iframes). Upgrade Definition GDD enforces this ceiling at S4 apply time."
    added: 2026-05-18
    revised: "2026-05-19"

  - name: pity_threshold
    status: active
    source: design/gdd/upgrade-definition.md
    referenced_by:
      - design/gdd/game-concept.md
      - design/gdd/upgrade-definition.md
    value: 3
    unit: draws
    notes: "Maximum consecutive draws without the player's most-picked upgrade category before the next draw is guaranteed to include that category. Changed from 2 (game-concept.md default) to 3 in upgrade-definition.md to preserve player agency (2 was a rail, 3 is a safety net). Progression System GDD must implement this rule."
    added: 2026-05-19
    revised: ""

  - name: damage_reduction_cap
    status: active
    source: design/gdd/damage-health.md
    referenced_by:
      - design/gdd/damage-health.md
    value: 0.75
    unit: multiplier
    notes: "Maximum damage_reduction Survivability upgrades can provide. Enforced at upgrade-apply time in Damage & Health. Above cap: clamped and designer error logged."
    added: 2026-05-16
    revised: ""

  - name: stagger_resist_multiplier
    status: active
    source: design/gdd/enemy-definition.md
    referenced_by:
      - design/gdd/enemy-definition.md
    value: 0.5
    unit: multiplier
    notes: "Damage fraction applied to elite enemies when Finisher lands without full combo. Cross-system: Combo System reads this at Finisher resolution."
    added: 2026-05-11
    revised: ""

  - name: phase_2_threshold_ratio
    status: active
    source: design/gdd/enemy-definition.md
    referenced_by:
      - design/gdd/enemy-definition.md
    value: 0.5
    unit: ratio
    notes: "HP fraction at which Warlord Phase 2 transition fires. Default: 50% max HP."
    added: 2026-05-11
    revised: ""

