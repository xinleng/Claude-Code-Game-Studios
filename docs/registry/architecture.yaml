# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-07-04"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: player_hp
    status: active
    owner_system: PlayerHealthSystem
    adr: docs/architecture/adr-0003-event-architecture.md
    interface: "IPlayerHealth.CurrentHp / MaxHp (read-only); ApplyDamage/ApplyHeal are the only mutation paths"
    write_access: PlayerHealthSystem-only
    referenced_by:
      - docs/architecture/adr-0003-event-architecture.md
      - docs/architecture/adr-0009-ui-architecture.md
    added: 2026-07-04
    revised: ""
  - state: player_invulnerability
    status: active
    owner_system: PlayerHealthSystem
    adr: docs/architecture/adr-0003-event-architecture.md
    interface: "OpenInvulnerability(duration_ms) — single shared timer, latest-end-time-wins; callers: ParrySystem (300ms), DodgeSystem (400ms)"
    write_access: PlayerHealthSystem-only
    referenced_by:
      - docs/architecture/adr-0003-event-architecture.md
    added: 2026-07-04
    revised: ""
  - state: combo_counter
    status: active
    owner_system: ComboSystem
    adr: docs/architecture/adr-0002-frame-execution-order.md
    interface: "IComboSystem.ComboCounter (read-only int {0,1,2}); AdvanceFromParry() is the only external mutator (P3)"
    write_access: ComboSystem-only
    referenced_by:
      - docs/architecture/adr-0002-frame-execution-order.md
      - docs/architecture/adr-0003-event-architecture.md
    added: 2026-07-04
    revised: ""
  - state: momentum_meter
    status: active
    owner_system: ParrySystem
    adr: docs/architecture/adr-0003-event-architecture.md
    interface: "IParrySystem.MomentumMeter (read-only float 0–100); reset applied by ParrySystem inside the ordered DamageTaken dispatch"
    write_access: ParrySystem-only
    referenced_by:
      - docs/architecture/adr-0003-event-architecture.md
    added: 2026-07-04
    revised: ""
  - state: run_clock
    status: active
    owner_system: RunSessionManager
    adr: docs/architecture/adr-0002-frame-execution-order.md
    interface: "runStartTime distributed at run init to InputManager/EnemySystemManager/WaveSpawner; all timestamps run-local"
    write_access: RunSessionManager-only
    referenced_by:
      - docs/architecture/adr-0002-frame-execution-order.md
      - docs/architecture/adr-0004-input-authority.md
    added: 2026-07-04
    revised: ""
  - state: raw_input_devices
    status: active
    owner_system: InputManager
    adr: docs/architecture/adr-0004-input-authority.md
    interface: "IInputAuthority — InputManager is the sole subscriber to Input System devices/actions"
    write_access: InputManager-only
    referenced_by:
      - docs/architecture/adr-0004-input-authority.md
    added: 2026-07-04
    revised: ""
  - state: enemy_state_and_hp
    status: active
    owner_system: EnemySystemManager
    adr: docs/architecture/adr-0001-entity-architecture.md
    interface: "IEnemyWorld.ApplyEnemyDamage / RequestStagger / NearestEnemies; two-phase tick (damage then state-transition)"
    write_access: EnemySystemManager-only
    referenced_by:
      - docs/architecture/adr-0001-entity-architecture.md
      - docs/architecture/adr-0005-object-pooling-lifecycle.md
      - docs/architecture/adr-0007-spatial-queries-steering.md
    added: 2026-07-04
    revised: ""

