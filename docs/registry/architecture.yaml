# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: player_input
    status: active
    api: "Input System package (Input Actions asset + generated wrapper), wrapped by InputManager/IInputAuthority"
    not: "legacy UnityEngine.Input class"
    adr: docs/architecture/adr-0004-input-authority.md
    reason: "Legacy Input deprecated in Unity 6; buffering/fairness requires a single capture point"
    referenced_by: []
    added: 2026-07-04
    revised: ""
  - purpose: range_and_hit_queries
    status: active
    api: "Physics.OverlapSphereNonAlloc with pre-allocated Collider[200] buffers (player-centric AoE); uniform grid for enemy separation; plain distance-squared for enemy→player"
    not: "Physics.OverlapSphere / RaycastAll (allocating); NavMesh for MVP"
    adr: docs/architecture/adr-0007-spatial-queries-steering.md
    reason: "No per-call allocation; O(n²) forbidden by enemy-definition Contract #3"
    referenced_by:
      - docs/architecture/adr-0001-entity-architecture.md
    added: 2026-07-04
    revised: ""
  - purpose: telegraph_and_combat_vfx
    status: active
    api: "VFX Graph with GPU instancing, one asset per telegraph shape; RecordRenderGraph for screen-space overlays"
    not: "per-enemy ParticleSystem instances; URP Compatibility Mode passes"
    adr: docs/architecture/adr-0008-vfx-rendering.md
    reason: "Draw-call budget at 200 telegraphs; Compatibility Mode deprecated in 6.3"
    referenced_by: []
    added: 2026-07-04
    revised: ""
  - purpose: runtime_ui
    status: active
    api: "UI Toolkit (UIDocument/UXML/USS), event-driven presenters"
    not: "UGUI Canvas for new screens; per-frame polling of gameplay state; VisualElement.transform (deprecated 6.2+)"
    adr: docs/architecture/adr-0009-ui-architecture.md
    reason: "Technical preferences mandate UI Toolkit; retained-mode + change-driven updates"
    referenced_by: []
    added: 2026-07-04
    revised: ""
  - purpose: game_data_and_tuning
    status: active
    api: "ScriptableObjects (EnemyDataSO, GeneralData, UpgradeCatalogueSO, TuningConfig) with direct serialized references + bootstrap GameDataValidator"
    not: "Addressables (MVP); Resources.Load; hardcoded gameplay values"
    adr: docs/architecture/adr-0006-data-configuration.md
    reason: "MVP content volume is trivial; Resources deprecated practice; coding standard requires external values"
    referenced_by:
      - docs/architecture/adr-0005-object-pooling-lifecycle.md
    added: 2026-07-04
    revised: ""
  - purpose: time_source_in_gameplay_logic
    status: active
    api: "injected IGameClock (Time/UnscaledTime/DeltaTime)"
    not: "direct Time.time / Time.unscaledTime reads inside testable gameplay logic"
    adr: docs/architecture/adr-0010-test-harness.md
    reason: "Deterministic EditMode tests require an injectable clock"
    referenced_by:
      - docs/architecture/adr-0002-frame-execution-order.md
    added: 2026-07-04
    revised: ""
  - purpose: randomness_in_gameplay_logic
    status: active
    api: "injected System.Random (seedable)"
    not: "UnityEngine.Random inside testable gameplay logic"
    adr: docs/architecture/adr-0010-test-harness.md
    reason: "Deterministic tests for jitter/draws require seedable RNG"
    referenced_by: []
    added: 2026-07-04
    revised: ""

