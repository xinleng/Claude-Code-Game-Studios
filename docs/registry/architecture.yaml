# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: unityevent_on_combat_path
    status: active
    description: "UnityEvent (or SendMessage) must not carry any per-hit/per-frame combat event. Use publisher-owned System.Action<T> with readonly-struct payloads."
    why: "Reflection dispatch + argument boxing causes GC pressure at 200-enemy hit frequency (damage-health.md hard prohibition)."
    adr: docs/architecture/adr-0003-event-architecture.md
    added: 2026-07-04
  - pattern: self_updating_combat_system
    status: active
    description: "No combat/gameplay system may implement its own Update()/FixedUpdate(). All ticks flow through InputManager(-200) → EnemySystemManager(-100) → CombatFrame(0)."
    why: "Intra-frame ordering contracts (parry priority, damage-before-state-transition) break under unspecified script ordering."
    adr: docs/architecture/adr-0002-frame-execution-order.md
    added: 2026-07-04
  - pattern: raw_device_access_outside_inputmanager
    status: active
    description: "Keyboard.current / Mouse.current / Gamepad.current / InputAction reads are forbidden outside InputManager.cs. Grep-checkable (AC-IM-13)."
    why: "Single input authority is the parry-fairness guarantee (input-manager Core Rule 1)."
    adr: docs/architecture/adr-0004-input-authority.md
    added: 2026-07-04
  - pattern: setactive_false_outside_pool
    status: active
    description: "GameObject.SetActive(false) on enemies (and Destroy on any pooled object) is forbidden outside ObjectPool.ReturnToPool."
    why: "Any other deactivation path silently bypasses the parry-event flush contract → ghost parry windows (enemy-definition Contract #2)."
    adr: docs/architecture/adr-0005-object-pooling-lifecycle.md
    added: 2026-07-04
  - pattern: hardcoded_gameplay_value
    status: active
    description: "No gameplay/tuning value may be a literal in code. All values come from GameData ScriptableObjects (TuningConfig etc.). Exception: boundary-value tests where the number IS the point."
    why: "Coding standard: data-driven values; balance changes must never require code changes."
    adr: docs/architecture/adr-0006-data-configuration.md
    added: 2026-07-04
  - pattern: allocating_physics_queries
    status: active
    description: "Physics.OverlapSphere / RaycastAll (allocating overloads) are forbidden. Use NonAlloc variants with pre-allocated buffers."
    why: "Per-call managed array allocation → GC pressure at query frequency (enemy-definition Contract #3, deprecated-apis.md)."
    adr: docs/architecture/adr-0007-spatial-queries-steering.md
    added: 2026-07-04
  - pattern: urp_compatibility_mode_pass
    status: active
    description: "Custom render passes must implement RecordRenderGraph. The Execute(ScriptableRenderContext, ref RenderingData) Compatibility Mode path is forbidden."
    why: "Compatibility Mode is hidden and deprecated in Unity 6.3 (breaking-changes.md); building on it guarantees forced migration."
    adr: docs/architecture/adr-0008-vfx-rendering.md
    added: 2026-07-04
  - pattern: direct_cross_system_state_write
    status: active
    description: "A system must never write state owned by another system (see state_ownership). Mutations go through the owner's interface methods only."
    why: "Preserves the one-owner-per-fact principle every GDD contract assumes; prevents race/ordering bugs."
    adr: docs/architecture/adr-0003-event-architecture.md
    added: 2026-07-04

