# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: damage_taken_dispatch
    status: active
    pattern: direct_call
    detail: "Ordered sequential dispatch inside PlayerHealthSystem: S6 pre-read → apply damage → threshold-gated resets (Parry then Combo) → multicast DamageTaken (presentation) → PlayerDead. Payload: DamageTakenData readonly struct."
    adr: docs/architecture/adr-0003-event-architecture.md
    referenced_by:
      - docs/architecture/adr-0002-frame-execution-order.md
    added: 2026-07-04
    revised: ""
  - contract: gameplay_events
    status: active
    pattern: signal
    detail: "Publisher-owned System.Action<T> with readonly-struct payloads for all gameplay events (SwingLanded, ParrySucceeded, FinisherResolved, AttackEvent presentation tier, PlayerDead)."
    adr: docs/architecture/adr-0003-event-architecture.md
    referenced_by:
      - docs/architecture/adr-0009-ui-architecture.md
    added: 2026-07-04
    revised: ""
  - contract: attack_event_delivery
    status: active
    pattern: direct_call
    detail: "parry.ReceiveAttackEvent(in evt) is the authoritative delivery; AttackerId-keyed dictionary; ParrySystem.FlushEventsFor(id) called by ObjectPool.ReturnToPool and Warlord phase transition."
    adr: docs/architecture/adr-0003-event-architecture.md
    referenced_by:
      - docs/architecture/adr-0005-object-pooling-lifecycle.md
    added: 2026-07-04
    revised: ""
  - contract: parry_press_consumption
    status: active
    pattern: direct_call
    detail: "Consumer-pull: TryConsumeParryPress(notBefore) / HasLiveParryPress(); ring buffer capacity 4, 120ms front-extension; one press one consumption."
    adr: docs/architecture/adr-0004-input-authority.md
    referenced_by: []
    added: 2026-07-04
    revised: ""
  - contract: run_reset
    status: active
    pattern: direct_call
    detail: "IRunResettable.ResetForNewRun() registered with RunSessionManager; invoked only from a Resolved state (guarded)."
    adr: docs/architecture/adr-0002-frame-execution-order.md
    referenced_by:
      - docs/architecture/adr-0006-data-configuration.md
    added: 2026-07-04
    revised: ""
  - contract: frame_order
    status: active
    pattern: direct_call
    detail: "[-200] InputManager → [-100] EnemySystemManager → [0] CombatFrame(Parry→Dodge→CombatCore→Combo→PlayerHealth→Progression) → [+100] Presentation. Combat sub-order = explicit sequential calls in CombatFrame.RunFrame(dt)."
    adr: docs/architecture/adr-0002-frame-execution-order.md
    referenced_by:
      - docs/architecture/adr-0001-entity-architecture.md
      - docs/architecture/adr-0010-test-harness.md
    added: 2026-07-04
    revised: ""

